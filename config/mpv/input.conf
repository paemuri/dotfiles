# Mouse buttons.
MBTN_BACK     playlist-prev # Skip to the previous file.
MBTN_FORWARD  playlist-next # Skip to the next file.
MBTN_LEFT     ignore
MBTN_LEFT_DBL ignore
MBTN_RIGHT    ignore

# Mouse wheel.
WHEEL_UP    ignore
WHEEL_DOWN  ignore
WHEEL_LEFT  ignore
WHEEL_RIGHT ignore

# Arrow keys.
RIGHT            no-osd seek  5        # Seek 5 seconds forward.
LEFT             no-osd seek -5        # Seek 5 seconds backward.
UP               no-osd seek  60       # Seek 1 minute forward.
DOWN             no-osd seek -60       # Seek 1 minute backward.
Shift+RIGHT      no-osd seek  5 exact  # Seek exactly 5 second forward.
Shift+LEFT       no-osd seek -5 exact  # Seek exactly 5 second backward.
Shift+UP         no-osd seek  60 exact # Seek exactly 60 seconds forward.
Shift+DOWN       no-osd seek -60 exact # Seek exactly 60 seconds backward.
Ctrl+LEFT        no-osd sub-seek -1    # Seek to the previous subtitle.
Ctrl+RIGHT       no-osd sub-seek  1    # Seek to the next subtitle.
Ctrl+Shift+LEFT  sub-step -1           # Change subtitle timing such that the previous subtitle is displayed.
Ctrl+Shift+RIGHT sub-step  1           # Change subtitle timing such that the next subtitle is displayed.
Alt+LEFT         add video-pan-x  0.1  # Move the video position right.
Alt+RIGHT        add video-pan-x -0.1  # Move the video position left.
Alt+UP           add video-pan-y  0.1  # Move the video position down.
Alt+DOWN         add video-pan-y -0.1  # Move the video position up.

# Navigation keys.
PGUP        add chapter 1  # Go to the next chapter.
PGDWN       add chapter -1 # Go to the previous chapter.
Shift+PGUP  seek 600       # Seek 10 minutes forward.
Shift+PGDWN seek -600      # Seek 10 minutes backward.

# Backspace.
BS            set speed 1.0                        # Reset the speed to normal.
Alt+BS        set video-pan-x 0; set video-pan-y 0 # Reset video position.
Shift+BS      ignore
Shift+Ctrl+BS ignore

# Control keys.
ESC         set fullscreen no # Leave fullscreen.
SPACE       cycle pause       # Toggle pause/play.
ENTER       cycle pause       # Toggle pause/play.
PLAY        cycle pause       # Toggle pause/play.
PAUSE       cycle pause       # Toggle pause/play.
PLAYPAUSE   cycle pause       # Toggle pause/play.
PLAYONLY    set pause no      # Play.
PAUSEONLY   set pause yes     # Pause.
STOP        quit-watch-later  # Exit and remember the playback position.
FORWARD     seek 60           # Seek 1 minute forward.
REWIND      seek -60          # Seek 1 minute backward.
NEXT        playlist-next     # Skip to the next file.
PREV        playlist-prev     # Skip to the previous file.
CLOSE_WIN   quit-watch-later  # Exit and remember the playback position.
POWER       ignore
VOLUME_UP   ignore
VOLUME_DOWN ignore
MUTE        ignore
DEL         ignore

# F keys.
F8 show-text ${playlist}   # Show playlist.
F9 show-text ${track-list} # Show list of video, audio and sub tracks.

# Numbers.
1     add contrast -1   # Decrease contrast.
2     add contrast 1    # Increase contrast.
3     add brightness -1 # Decrease brightness.
4     add brightness 1  # Increase brightness.
5     add gamma -1      # Decrease gamma.
6     add gamma 1       # Increase gamma.
7     add saturation -1 # Decrease saturation.
8     add saturation 1  # Increase saturation.
9     ignore
0     ignore
Alt+0 ignore
Alt+1 ignore
Alt+2 ignore

# Calc chars.
+      add volume       10    # Increase volume.
-      add volume      -10    # Decrease volume.
=      set volume       100   # Reset volume.
Alt++  add video-zoom   0.1   # Zoom in.
Alt+-  add video-zoom  -0.1   # Zoom out.
Alt+=  set video-zoom   0     # Reset zoom.
Ctrl++ add audio-delay  0.100 # Delay audio timing.
Ctrl+- add audio-delay -0.100 # Rush audio timing.
Ctrl+= set audio-delay  1.000 # Reset audio timing.
/      ignore
*      ignore

# Other special chars.
! add chapter -1                # Go to the previous chapter.
@ add chapter  1                # Go to the next chapter.
` script-binding console/enable # Open console.
[ multiply speed 1/1.1          # Decrease the playback speed.
] multiply speed 1.1            # Increase the playback speed.
{ multiply speed 0.5            # Halve the playback speed.
} multiply speed 2.0            # Double the playback speed.
. frame-step                    # Advance one frame and pause.
, frame-back-step               # Go back by one frame and pause.
> playlist-next                 # Skip to the next file.
< playlist-prev                 # Skip to the previous file.
? ignore

# Common chars.
# Quit.
q      quit-watch-later                          # Exit and remember the playback position.
Q      quit-watch-later                          # Exit and remember the playback position.
Ctrl+q quit-watch-later                          # Exit and remember the playback position.
Ctrl+w quit-watch-later                          # Exit and remember the playback position.
# Screenshot.
s      screenshot                                # Take screenshot with subtitles.
S      screenshot video                          # Take screenshot without subtitles.
Ctrl+s screenshot window                         # Take screenshot with substitles and OSD.
Alt+s  screenshot each-frame                     # Start/stop screenshotting every frame.
# Subtitles.
v      cycle sub-visibility                      # Toggle subtitles.
Alt+v  cycle secondary-sub-visibility            # Toggle secondary subtitles.
j      cycle sub                                 # Switch subtitle track.
J      cycle sub down                            # Switch subtitle track backwards.
r      add sub-pos -1                            # Move subtitles up.
t      add sub-pos +1                            # Move subtitles down.
z      add sub-delay -0.1                        # Rush subtitles by 100 ms.
x      add sub-delay +0.1                        # Delay subtitles by 100 ms.
Ctrl+z add sub-scale +0.1                        # Increase the subtitle font size.
Ctrl+x add sub-scale -0.1                        # Decrease the subtitle font size.
# Misc.
k      cycle audio                               # Switch audio track.
h      cycle video                               # Switch video track.
f      cycle fullscreen                          # Toggle fullscreen.
p      show-progress                             # Show playback progress.
i      script-binding stats/display-stats-toggle # Display info and stats.
m      cycle mute                                # Toggle mute.
l      ab-loop                                   # Set/clear A-B loop points.
L      cycle-values loop-file "inf" "no"         # Toggle infinite looping.
# Ignore.
P      ignore
o      ignore
O      ignore
I      ignore
Z      ignore
w      ignore
W      ignore
e      ignore
A      ignore
E      ignore
V      ignore
R      ignore
u      ignore
d      ignore
T      ignore
Ctrl+c ignore
Ctrl+h ignore

