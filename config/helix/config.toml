theme = "gruvbox_dark_hard"

[editor]
line-number = "relative"
bufferline = "always"
auto-pairs = false
auto-format = true

[editor.file-picker]
hidden = false
parents = false
ignore = false
git-ignore = false
git-global = false
git-exclude = false

# Space H and Space I: toggle hidden / git-ignored files in the file picker and
# global search. One option per key: Helix drops several `:set`/`:toggle` in a
# binding, and a picker opened by the same key still uses the old values.
[keys.normal.space]
H = ":toggle file-picker.hidden"
I = ":toggle file-picker.git-ignore"
