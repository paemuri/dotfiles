theme = "gruvbox_dark_hard"

[editor]
line-number = "relative"
bufferline = "always"
auto-pairs = false
auto-format = true

[editor.file-picker]
hidden = false
parents = false
ignore = false
git-ignore = false
git-global = false
git-exclude = false

# Space+f: filtered picker (no hidden or ignored files).
# Space+F: everything.
# Space+/: global search; follows whichever picker was opened last.
[keys.normal.space]
f = [
  ":set file-picker.hidden true",
  ":set file-picker.ignore true",
  ":set file-picker.git-ignore true",
  ":set file-picker.git-global true",
  ":set file-picker.git-exclude true",
  "file_picker",
]
F = [
  ":set file-picker.hidden false",
  ":set file-picker.ignore false",
  ":set file-picker.git-ignore false",
  ":set file-picker.git-global false",
  ":set file-picker.git-exclude false",
  "file_picker",
]
