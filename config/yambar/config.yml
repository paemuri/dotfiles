awesome: &awesome "Font Awesome 5 Free"

bar:
  height: 20
  location: "top"
  foreground: "fdf4c1ff"
  background: "282828ff"
  font: "Fira Mono" 
  spacing: 7

  border:
    width: 0

  left:
    - river:
        content:
          map:
            tag: "state"
            values:
              focused:
                string:
                  margin: 5
                  text: "{id}"
                  deco:
                    underline:
                      size: 2
                      color: "79740eff"
              unfocused:
                string:
                  margin: 5
                  text: "{id}"
              invisible:
                map:
                  tag: "occupied"
                  values:
                    false:
                      empty: {}
                    true:
                      string:
                        margin: 5
                        text: "{id}"

  right:
    - script:
        path: /home/paemuri/.local/bin/yambar-mod-uptime
        content:
          - string:
              font: *awesome
              text: ""
          - string:
              text: "{time}"
    - script:
        path: /home/paemuri/.local/bin/yambar-mod-audio
        content:
          - map:
              tag: "muted"
              values:
                true:
                  string:
                    font: *awesome
                    text: ""
                false:
                  string:
                    font: *awesome
                    text: ""
          - string:
              text: "{volume}"
    - script:
        path: /home/paemuri/.local/bin/yambar-mod-mic
        content:
          - map:
              tag: "muted"
              values:
                true:
                  string:
                    font: *awesome
                    text: ""
                false:
                  string:
                    font: *awesome
                    text: ""
          - string:
              text: "{volume}"
    - backlight:
        name: "amdgpu_bl1"
        content:
          - string:
              font: *awesome
              text: ""
          - string:
              text: "{percent}%"
    - script:
        path: /home/paemuri/.local/bin/yambar-mod-wifi
        content:
          - string:
              font: *awesome
              text: ""
          - map:
              tag: "state"
              default:
                string:
                  text: "{state}"
              values:
                connected:
                  string:
                    text: "{ssid}"
    - script:
        path: /home/paemuri/.local/bin/yambar-mod-cpu
        content:
          - string:
              font: *awesome
              text: ""
          - string:
              text: "{percent}%"
    - script:
        path: /home/paemuri/.local/bin/yambar-mod-memory
        content:
          - string:
              font: *awesome
              text: ""
          - string:
              text: "{percent}% {usage}M"
    - script:
        path: /home/paemuri/.local/bin/yambar-mod-temp
        content:
          - string:
              font: *awesome
              text: ""
          - string:
              text: "{temp}°C"
    - script:
        path: /home/paemuri/.local/bin/yambar-mod-disk
        content:
          - string:
              font: *awesome
              text: ""
          - string:
              text: "{percent}% {usage}"
    - script:
        path: /home/paemuri/.local/bin/yambar-mod-battery
        content:
          map:
            tag: "charging"
            values:
              false:
                - ramp:
                    tag: "capacity"
                    items:
                      - list:
                          items:
                            - string:
                                font: *awesome
                                text: ""
                            - string:
                                text: "{capacity}%"
                      - list:
                          items:
                            - string:
                                font: *awesome
                                text: ""
                            - string:
                                text: "{capacity}%"
                      - list:
                          items:
                            - string:
                                font: *awesome
                                text: ""
                            - string:
                                text: "{capacity}%"
                      - list:
                          items:
                            - string:
                                font: *awesome
                                text: ""
                            - string:
                                text: "{capacity}%"
                      - list:
                          items:
                            - string:
                                font: *awesome
                                text: ""
                            - string:
                                text: "{capacity}%"
              true:
                - list:
                    items:
                      - string:
                          font: *awesome
                          text: ""
                      - string:
                          text: "{capacity}%"
    - clock:
        date-format: "%Y-%m-%d"
        time-format: "%H:%M:%S"
        content:
          - string:
              text: "{date} {time}"
              right-margin: 5

