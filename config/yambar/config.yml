awesome: &awesome "Font Awesome 5 Free"

bar:
  height: 20
  location: "top"
  foreground: "fdf4c1ff"
  background: "282828ff"
  font: "Fira Mono"
  spacing: 7

  border:
    width: 0

  left:
    - river:
        content:
          map:
            conditions:
              state == focused:
                string:
                  margin: 5
                  text: "{id}"
                  deco:
                    underline:
                      size: 2
                      color: "79740eff"
              state == unfocused:
                string:
                  margin: 5
                  text: "{id}"
              state == invisible:
                map:
                  conditions:
                    ~occupied:
                      empty: {}
                    occupied:
                      string:
                        margin: 5
                        text: "{id}"

  right:
    - script:
        path: /home/paemuri/.local/bin/yambar-mod-recording
        content:
          - string:
              font: *awesome
              foreground: "9d0006ff"
              text: "{symbol}"
    - script:
        path: /home/paemuri/.local/bin/yambar-mod-uptime
        content:
          - string:
              font: *awesome
              text: "{symbol}"
          - string:
              text: "{text}"
    - script:
        path: /home/paemuri/.local/bin/yambar-mod-audio
        content:
          - string:
              font: *awesome
              text: "{symbol}"
          - string:
              text: "{text}"
    - script:
        path: /home/paemuri/.local/bin/yambar-mod-mic
        content:
          - string:
              font: *awesome
              text: "{symbol}"
          - string:
              text: "{text}"
    - backlight:
        name: "amdgpu_bl2"
        content:
          - string:
              font: *awesome
              text: ""
          - string:
              text: "{percent}%"
    - script:
        path: /home/paemuri/.local/bin/yambar-mod-wifi
        content:
          - string:
              font: *awesome
              text: "{symbol}"
          - string:
              text: "{text}"
    - script:
        path: /home/paemuri/.local/bin/yambar-mod-memory
        content:
          - string:
              font: *awesome
              text: "{symbol}"
          - string:
              text: "{text}"
    - script:
        path: /home/paemuri/.local/bin/yambar-mod-temp
        content:
          - string:
              font: *awesome
              text: "{symbol}"
          - string:
              text: "{text}"
    - script:
        path: /home/paemuri/.local/bin/yambar-mod-disk
        content:
          - string:
              font: *awesome
              text: "{symbol}"
          - string:
              text: "{text}"
    - script:
        path: /home/paemuri/.local/bin/yambar-mod-battery
        content:
          - string:
              font: *awesome
              text: "{symbol}"
          - string:
              text: "{text}"
    - clock:
        date-format: "%F"
        time-format: "%T"
        content:
          - string:
              text: "{date} {time}"
              right-margin: 5

